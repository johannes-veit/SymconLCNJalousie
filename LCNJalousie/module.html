<style>
    :root {
        /*
         * Die HTML-SDK-Kachel übernimmt ausschließlich die von Symcon
         * bereitgestellten Farben der aktuell geöffneten Visualisierung.
         * Weder Browser- noch Betriebssystem-Dark-Mode werden ausgewertet.
         */
        --jal-accent: var(--accent-color, #00bfa5);
        --jal-text: var(--content-color, #17212b);
        --jal-muted: color-mix(in srgb, var(--content-color, #17212b) 62%, transparent);
        --jal-surface: var(--card-color, #ffffff);
        --jal-line: color-mix(in srgb, var(--content-color, #17212b) 20%, transparent);
        --jal-shadow: 0 3px 12px rgba(0, 0, 0, 0.13);
        --jal-button-size: clamp(58px, 7vw, 78px);
        --jal-graphic-width: clamp(82px, 10vw, 112px);
        --jal-graphic-height: clamp(155px, 24vh, 215px);
        --jal-slider-column-width: clamp(56px, 6vw, 72px);
    }

    * {
        box-sizing: border-box;
    }

    [hidden] {
        display: none !important;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        margin: 0;
        overflow: hidden;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--jal-text);
        background: transparent;
    }

    button,
    input {
        font: inherit;
    }

    .jal-tile {
        width: 100%;
        height: 100%;
        min-height: 310px;
        position: relative;
        display: grid;
        grid-template-rows: minmax(0, 1fr) auto;
        gap: clamp(8px, 1.3vh, 14px);
        padding: clamp(8px, 1.5vw, 16px);
        overflow: hidden;
        color: var(--jal-text);
        background: transparent;
    }

    .jal-main {
        min-height: 0;
        display: grid;
        grid-template-columns: repeat(2, minmax(285px, 1fr));
        gap: clamp(10px, 1.8vw, 22px);
        align-items: stretch;
    }

    .jal-panel {
        min-width: 0;
        min-height: 0;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        gap: 8px;
        padding: clamp(10px, 1.4vw, 16px);
        border: 1px solid var(--jal-line);
        border-radius: 14px;
        color: var(--jal-text);
        background: var(--jal-surface);
        box-shadow: var(--jal-shadow);
    }

    .jal-panel-title {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-size: clamp(16px, 1.8vw, 23px);
        font-weight: 650;
        line-height: 1.1;
    }

    .jal-panel-title i {
        color: var(--jal-accent);
    }

    /*
     * Beide Bedienfelder nutzen exakt dieselbe Dreispalten-Geometrie:
     * links Tasten, mittig Grafik, rechts Slider. Dadurch fluchten die
     * Elemente auch dann, wenn die Kacheln auf dem Smartphone untereinander
     * dargestellt werden.
     */
    .jal-control-layout {
        min-height: 0;
        display: grid;
        grid-template-columns:
            minmax(var(--jal-button-size), 0.78fr)
            minmax(var(--jal-graphic-width), 1fr)
            minmax(var(--jal-slider-column-width), 0.66fr);
        gap: clamp(8px, 1.4vw, 18px);
        align-items: center;
        justify-items: center;
    }

    .jal-round-stack {
        width: 100%;
        height: 100%;
        min-height: 218px;
        display: grid;
        grid-template-rows: repeat(3, minmax(var(--jal-button-size), 1fr));
        justify-items: center;
        align-items: center;
        gap: clamp(7px, 1vh, 12px);
    }

    .jal-round-button {
        width: var(--jal-button-size);
        height: var(--jal-button-size);
        border: 0;
        border-radius: 50%;
        display: grid;
        grid-template-rows: 1fr auto;
        place-items: center;
        gap: 1px;
        padding: 9px 5px 7px;
        color: #ffffff;
        background: var(--jal-accent);
        box-shadow: 0 3px 9px color-mix(in srgb, var(--jal-accent) 34%, transparent);
        cursor: pointer;
        transition: transform 120ms ease, filter 120ms ease, opacity 120ms ease, box-shadow 120ms ease;
    }

    .jal-round-button:hover:not(:disabled) {
        filter: brightness(1.07);
        transform: scale(1.025);
    }

    .jal-round-button:active:not(:disabled) {
        transform: scale(0.96);
    }

    .jal-round-button:disabled {
        opacity: 0.35;
        cursor: not-allowed;
        box-shadow: none;
    }

    .jal-round-button i {
        font-size: clamp(20px, 2.7vw, 30px);
    }

    .jal-round-button span {
        font-size: clamp(9px, 1vw, 12px);
        font-weight: 760;
        letter-spacing: 0.025em;
    }

    /*
     * Der Kranz zeigt ausschließlich einen aktuell laufenden bzw. gerade
     * angeforderten Befehl. Nach Abschluss (Phase Ruhe/Auftragstyp 0) wird er
     * durch die nächste Statusnachricht automatisch entfernt.
     */
    .jal-round-button.is-current:not(:disabled) {
        box-shadow:
            0 0 0 4px color-mix(in srgb, var(--jal-accent) 42%, transparent),
            0 3px 9px color-mix(in srgb, var(--jal-accent) 34%, transparent);
    }

    .jal-graphic-wrap {
        width: 100%;
        height: 100%;
        min-height: 218px;
        display: grid;
        place-items: center;
    }

    .jal-device-graphic {
        width: var(--jal-graphic-width);
        height: var(--jal-graphic-height);
        min-height: 155px;
        position: relative;
        display: grid;
        grid-template-rows: 11px minmax(0, 1fr) 7px;
        gap: 4px;
        color: var(--jal-text);
    }

    .jal-graphic-head,

        border-radius: 999px;
        background: currentColor;
        opacity: 0.92;
    }

    .jal-graphic-foot {
        height: 4px;
        align-self: end;
    }

    /* Behanggrafik: 0 % = leer/offen, 100 % = vollständig heruntergefahren. */

        overflow: hidden;
        border-left: 1px solid var(--jal-line);
        border-right: 1px solid var(--jal-line);

        opacity: 0.92;

    .jal-blind-curtain {
        position: absolute;
        inset: 0 0 auto 0;
        height: 0%;
        overflow: hidden;
        transition: height 330ms linear;
        color: var(--jal-text);
    }

    .jal-blind-lines {

    .jal-slat-field {

    .jal-slider-column {

    .jal-switch {

    .jal-switch-track {

        background: var(--jal-muted);

    .jal-switch-track::before {

        height: 18px;
        left: 3px;
        top: 3px;

        background: #ffffff;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.26);

    }

    .jal-switch input:checked + .jal-switch-track {
        background: var(--jal-accent);
    }

    .jal-switch input:checked + .jal-switch-track::before {
        transform: translateX(22px);
    }

    .jal-switch input:disabled + .jal-switch-track {

    .jal-warning {

</style>

<script>
    'use strict';

    let jalState = {
        position: 0,
        rotation: 0,
        shakeFree: false,
        driveState: 0,
        phase: 0,
        orderType: 0,
        targetPosition: 0,
        targetRotation: 0,
        commandActive: false,
        referenced: false,
        active: false,
        moduleEnabled: true,
        faultLatched: false,
        controlsEnabled: false,
        shakeFreeToggleEnabled: false,
        calibrationRemainingSeconds: 0,
        intermediateAllowed: false,
        stopEnabled: false,
        faultResetAllowed: false,
        statusText: 'GESTOPPT',
        statusKey: 'stopped',
        errorText: ''
    };

    let jalPendingCommand = null;

    const byId = (id) => document.getElementById(id);
    const clamp = (value) => Math.max(0, Math.min(100, Number(value) || 0));
    const formatPercent = (value) => `${Math.round(clamp(value))} %`;

    function handleMessage(data) {
        try {
            const decoded = typeof data === 'string' ? JSON.parse(data) : data;
            if (!decoded || typeof decoded !== 'object') {
                return;
            }
            jalState = {...jalState, ...decoded};

            // Sobald der Server den Auftrag übernommen hat, ist der lokale
            // Sofortindikator nicht mehr erforderlich. Nach Auftragsende
            // (commandActive=false) wird der Kranz ebenfalls sicher entfernt.
            if (Boolean(jalState.commandActive)) {
                jalPendingCommand = null;
            } else if (jalPendingCommand && Date.now() - jalPendingCommand.time > 650) {
                jalPendingCommand = null;
            }

            renderJalousie();
        } catch (error) {
            showLocalWarning(`Visualisierungsdaten ungültig: ${error.message}`);
        }
    }

    function sendJalousieAction(ident, value) {
        if (!jalState.active && ident !== 'ResetError') {
            showLocalWarning('Die Modulkonfiguration ist nicht freigegeben.');
            return;
        }

        jalPendingCommand = {
            ident,
            value: Number.isFinite(Number(value)) ? Number(value) : value,
            time: Date.now()
        };
        renderCommandFeedback();

        try {
            requestAction(ident, value);
        } catch (error) {
            jalPendingCommand = null;
            renderCommandFeedback();
            showLocalWarning(`Aktion konnte nicht gesendet werden: ${error.message}`);
        }
    }

    function showLocalWarning(message) {
        const tile = byId('jal-tile');
        const warning = byId('jal-warning-text');
        warning.textContent = message;
        tile.classList.add('has-warning');
        window.setTimeout(() => tile.classList.remove('has-warning'), 5000);
    }

    function clearCommandFeedback() {
        document.querySelectorAll('.jal-round-button.is-current').forEach((button) => {
            button.classList.remove('is-current');
        });
    }

    function setMatchingButtonCurrent(selector, value) {
        document.querySelectorAll(selector).forEach((button) => {
            const buttonValue = Number(button.dataset.value);
            button.classList.toggle('is-current', Math.abs(buttonValue - Number(value)) < 0.6);
        });
    }

    function renderCommandFeedback() {
        clearCommandFeedback();

        if (jalPendingCommand) {
            if (jalPendingCommand.ident === 'Position') {
                setMatchingButtonCurrent('.jal-position-command', jalPendingCommand.value);
            } else if (jalPendingCommand.ident === 'Drehgrad') {
                setMatchingButtonCurrent('.jal-slat-command', jalPendingCommand.value);
            } else if (jalPendingCommand.ident === 'Stop') {
                byId('jal-stop').classList.add('is-current');
            }
            return;
        }

        if (!Boolean(jalState.commandActive)) {
            return;
        }

        const orderType = Number(jalState.orderType) || 0;
        const phase = Number(jalState.phase) || 0;

        // Auftragstyp 1 = Behang, 4 = Referenzfahrt.
        if (orderType === 1 || orderType === 4) {
            setMatchingButtonCurrent('.jal-position-command', jalState.targetPosition);
        }

        // Auftragstyp 2 = Lamellenfahrt.
        if (orderType === 2) {
            setMatchingButtonCurrent('.jal-slat-command', jalState.targetRotation);
        }

        // Phase 5 = bestätigter Stoppablauf.
        if (phase === 5) {
            byId('jal-stop').classList.add('is-current');
        }
    }

    function renderJalousie() {
        const position = clamp(jalState.position);
        const rotation = clamp(jalState.rotation);
        const active = Boolean(jalState.active);
        const controlsEnabled = Boolean(jalState.controlsEnabled);
        const referenced = Boolean(jalState.referenced);
        const intermediateAllowed = Boolean(jalState.intermediateAllowed);

        const positionSlider = byId('jal-position');
        positionSlider.value = String(Math.round(position));
        positionSlider.disabled = !controlsEnabled;
        byId('jal-position-value').textContent = formatPercent(position);

        const rotationSlider = byId('jal-rotation');
        rotationSlider.value = String(Math.round(rotation));
        rotationSlider.disabled = !intermediateAllowed;
        byId('jal-rotation-value').textContent = formatPercent(rotation);

        document.querySelectorAll('.jal-position-command').forEach((button) => {
            button.disabled = !controlsEnabled;
        });
        document.querySelectorAll('.jal-slat-command').forEach((button) => {
            button.disabled = !intermediateAllowed;
        });
        byId('jal-stop').disabled = !Boolean(jalState.stopEnabled);

        renderCommandFeedback();

        const shakeSwitch = byId('jal-shakefree');
        shakeSwitch.checked = Boolean(jalState.shakeFree);
        shakeSwitch.disabled = !Boolean(jalState.shakeFreeToggleEnabled);
        byId('jal-shakefree-text').textContent = shakeSwitch.checked ? 'Ein' : 'Aus';

        const statusKey = jalState.statusKey || 'stopped';
        const statusText = jalState.statusText || 'GESTOPPT';
        const statusSuffix = referenced
            ? ` · Behang ${Math.round(position)}% · Lamellen ${Math.round(rotation)}%`
            : ' · Position nicht referenziert';
        const runStatus = byId('jal-run-status');
        runStatus.dataset.status = statusKey;
        byId('jal-run-status-text').textContent = `Laufstatus: ${statusText}${statusSuffix}`;

        // Grafische Behangposition: 0 % oben/offen, 100 % unten/geschlossen.
        byId('jal-blind-curtain').style.height = `${position}%`;

        // Grafische Lamellenstellung: 0 % AUF, 100 % ZU.
        const slatAngle = -55 + rotation * 1.1;
        document.querySelectorAll('.jal-slat-line').forEach((line) => {
            line.style.transform = `rotate(${slatAngle}deg)`;
        });

        const warningText = Boolean(jalState.faultLatched)
            ? (jalState.errorText || 'Fehler verriegelt – Symcon ist bis zur Quittierung inaktiv. Lokale LCN-Bedienung bleibt frei.')
            : (!Boolean(jalState.moduleEnabled)
                ? 'Symcon-Steuerung im Modulmenü deaktiviert – lokale LCN-Bedienung bleibt frei.'
                : (!active
                    ? 'Konfiguration unvollständig – Bedienung gesperrt.'
                    : (Number(jalState.phase) === 9
                        ? 'LCN-Statusabgleich läuft – Bedienung kurz gesperrt.'
                        : (jalState.errorText || ''))));
        const warning = byId('jal-warning-text');
        warning.textContent = warningText;
        byId('jal-reset-error').hidden = !Boolean(jalState.faultResetAllowed);
        byId('jal-tile').classList.toggle('has-warning', warningText !== '');
    }

    byId('jal-position').addEventListener('input', (event) => {
        byId('jal-position-value').textContent = formatPercent(event.target.value);
    });
    byId('jal-position').addEventListener('change', (event) => {
        const value = Math.round(clamp(event.target.value));
        if (value !== 0 && value !== 100 && !jalState.intermediateAllowed) {
            event.target.value = String(Math.round(clamp(jalState.position)));
            byId('jal-position-value').textContent = formatPercent(jalState.position);
            showLocalWarning('Zwischenposition erst nach einer Referenzfahrt verfügbar.');
            return;
        }
        sendJalousieAction('Position', value);
    });

    byId('jal-rotation').addEventListener('input', (event) => {
        byId('jal-rotation-value').textContent = formatPercent(event.target.value);
    });
    byId('jal-rotation').addEventListener('change', (event) => {
        if (!jalState.intermediateAllowed) {
            event.target.value = String(Math.round(clamp(jalState.rotation)));
            byId('jal-rotation-value').textContent = formatPercent(jalState.rotation);
            showLocalWarning('Lamellenfahrt erst nach einer Referenzfahrt verfügbar.');
            return;
        }
        sendJalousieAction('Drehgrad', Math.round(clamp(event.target.value)));
    });

    document.querySelectorAll('[data-action][data-value]').forEach((button) => {
        button.addEventListener('click', () => {
            sendJalousieAction(button.dataset.action, Number(button.dataset.value));
        });
    });

    byId('jal-stop').addEventListener('click', () => {
        sendJalousieAction('Stop', true);
    });

    byId('jal-shakefree').addEventListener('change', (event) => {
        sendJalousieAction('ShakeFree', Boolean(event.target.checked));
    });

    byId('jal-reset-error').addEventListener('click', () => {
        sendJalousieAction('ResetError', true);
    });

    renderJalousie();
</script>
