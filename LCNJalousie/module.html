<script>
    'use strict';

    let jalState = {
        name: 'LCN Jalousie',
        position: 0,
        rotation: 0,
        shakeFree: false,
        driveState: 0,
        phase: 0,
        referenced: false,
        active: false,
        controlsEnabled: false,
        intermediateAllowed: false,
        stopEnabled: false,
        statusText: 'GESTOPPT',
        statusKey: 'stopped',
        statusIcon: 'stop',
        errorText: ''
    };

    const byId = (id) => document.getElementById(id);
    const clamp = (value) => Math.max(0, Math.min(100, Number(value) || 0));
    const formatPercent = (value) => `${Math.round(clamp(value))} %`;

    function handleMessage(data) {
        try {
            const decoded = typeof data === 'string' ? JSON.parse(data) : data;
            if (!decoded || typeof decoded !== 'object') {
                return;
            }
            jalState = {...jalState, ...decoded};
            renderJalousie();
        } catch (error) {
            showLocalWarning(`Visualisierungsdaten ungültig: ${error.message}`);
        }
    }

    function sendJalousieAction(ident, value) {
        if (!jalState.active) {
            showLocalWarning('Die Modulkonfiguration ist nicht freigegeben.');
            return;
        }
        try {
            requestAction(ident, value);
        } catch (error) {
            showLocalWarning(`Aktion konnte nicht gesendet werden: ${error.message}`);
        }
    }

    function showLocalWarning(message) {
        const tile = byId('jal-tile');
        const warning = byId('jal-warning');
        warning.textContent = message;
        tile.classList.add('has-warning');
        window.setTimeout(() => tile.classList.remove('has-warning'), 5000);
    }

    function setIcon(element, iconName) {
        if (!element) {
            return;
        }
        element.className = `fa-light fa-${iconName || 'circle-info'}`;
    }

    function markPresetButtons(action, value) {
        document.querySelectorAll(`.jal-preset[data-action="${action}"]`).forEach((button) => {
            const buttonValue = Number(button.dataset.value);
            button.classList.toggle('is-current', Math.abs(buttonValue - Number(value)) < 0.6);
        });
    }

    function renderJalousie() {
        const position = clamp(jalState.position);
        const rotation = clamp(jalState.rotation);
        const active = Boolean(jalState.active);
        const controlsEnabled = Boolean(jalState.controlsEnabled);
        const referenced = Boolean(jalState.referenced);
        const intermediateAllowed = Boolean(jalState.intermediateAllowed);

        byId('jal-name').textContent = jalState.name || 'LCN Jalousie';

        const positionSlider = byId('jal-position');
        positionSlider.value = String(Math.round(position));
        positionSlider.disabled = !controlsEnabled;
        byId('jal-position-value').textContent = formatPercent(position);

        const rotationSlider = byId('jal-rotation');
        rotationSlider.value = String(Math.round(rotation));
        rotationSlider.disabled = !intermediateAllowed;
        byId('jal-rotation-value').textContent = formatPercent(rotation);

        document.querySelectorAll('.jal-preset[data-action="Position"]').forEach((button) => {
            const value = Number(button.dataset.value);
            button.disabled = !controlsEnabled || (value === 50 && !intermediateAllowed);
        });
        document.querySelectorAll('.jal-preset[data-action="Drehgrad"]').forEach((button) => {
            button.disabled = !intermediateAllowed;
        });
        markPresetButtons('Position', position);
        markPresetButtons('Drehgrad', rotation);

        const stopButton = byId('jal-stop');
        stopButton.disabled = !Boolean(jalState.stopEnabled);

        const shakeSwitch = byId('jal-shakefree');
        shakeSwitch.checked = Boolean(jalState.shakeFree);
        shakeSwitch.disabled = !controlsEnabled;
        byId('jal-shakefree-text').textContent = shakeSwitch.checked ? 'Ein' : 'Aus';

        const referenceBadge = byId('jal-reference');
        referenceBadge.classList.toggle('is-valid', referenced);
        byId('jal-reference-text').textContent = referenced ? 'Position gültig' : 'Referenz erforderlich';
        setIcon(byId('jal-reference-icon'), referenced ? 'circle-check' : 'circle-exclamation');

        const statusChip = byId('jal-status-chip');
        statusChip.dataset.status = jalState.statusKey || 'stopped';
        byId('jal-status-text').textContent = jalState.statusText || 'GESTOPPT';
        setIcon(byId('jal-status-icon'), jalState.statusIcon || 'stop');

        const statusSuffix = referenced
            ? ` · Behang ${Math.round(position)}% · Lamellen ${Math.round(rotation)}%`
            : ' · Position nicht referenziert';
        byId('jal-run-status').textContent = `Laufstatus: ${jalState.statusText || 'GESTOPPT'}${statusSuffix}`;

        // Behanghöhe: 0 % zeigt keine Lamellenfläche, 100 % die volle Fläche.
        byId('jal-slat-mask').style.height = `${position}%`;
        // 0 % Lamelle = AUF-Richtung, 100 % = ZU-Richtung.
        const slatAngle = -55 + rotation * 1.1;
        byId('jal-slat-lines').style.setProperty('--slat-angle', `${slatAngle}deg`);
        document.querySelectorAll('.jal-slat-line').forEach((line) => {
            line.style.transform = `rotate(${slatAngle}deg)`;
        });

        const warningText = !active
            ? 'Konfiguration unvollständig – Bedienung gesperrt.'
            : (Number(jalState.phase) === 9
                ? 'LCN-Statusabgleich läuft – Bedienung kurz gesperrt.'
                : (jalState.errorText || ''));
        const warning = byId('jal-warning');
        warning.textContent = warningText;
        byId('jal-tile').classList.toggle('has-warning', warningText !== '');
    }

    byId('jal-position').addEventListener('input', (event) => {
        byId('jal-position-value').textContent = formatPercent(event.target.value);
    });
    byId('jal-position').addEventListener('change', (event) => {
        const value = Math.round(clamp(event.target.value));
        if (value !== 0 && value !== 100 && !jalState.intermediateAllowed) {
            event.target.value = String(Math.round(clamp(jalState.position)));
            byId('jal-position-value').textContent = formatPercent(jalState.position);
            showLocalWarning('Zwischenposition erst nach einer Referenzfahrt verfügbar.');
            return;
        }
        sendJalousieAction('Position', value);
    });

    byId('jal-rotation').addEventListener('input', (event) => {
        byId('jal-rotation-value').textContent = formatPercent(event.target.value);
    });
    byId('jal-rotation').addEventListener('change', (event) => {
        if (!jalState.intermediateAllowed) {
            event.target.value = String(Math.round(clamp(jalState.rotation)));
            byId('jal-rotation-value').textContent = formatPercent(jalState.rotation);
            showLocalWarning('Lamellenfahrt erst nach einer Referenzfahrt verfügbar.');
            return;
        }
        sendJalousieAction('Drehgrad', Math.round(clamp(event.target.value)));
    });

    document.querySelectorAll('.jal-preset').forEach((button) => {
        button.addEventListener('click', () => {
            sendJalousieAction(button.dataset.action, Number(button.dataset.value));
        });
    });

    byId('jal-stop').addEventListener('click', () => {
        sendJalousieAction('Stop', true);
    });

    byId('jal-shakefree').addEventListener('change', (event) => {
        sendJalousieAction('ShakeFree', Boolean(event.target.checked));
    });

    renderJalousie();
</script>
